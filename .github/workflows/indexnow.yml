name: IndexNow on deploy

# Fires after Vercel reports a successful Production deployment, so every deploy
# re-submits the full URL list to IndexNow. sitemap.xml and llms.txt are
# regenerated by the same deploy, which closes the loop: site tree + llms +
# IndexNow on every push. Ported from armanarai.com.
#
# Needs INDEXNOW_SECRET as a repo secret AND as an env var on the
# `canadian-weddings` Vercel project. Until both exist this step skips rather
# than failing the workflow.
on:
  deployment_status:

jobs:
  ping-indexnow:
    if: >-
      github.event.deployment_status.state == 'success' &&
      startsWith(github.event.deployment_status.environment, 'Production')
    runs-on: ubuntu-latest
    steps:
      - name: Submit URLs to IndexNow
        env:
          INDEXNOW_SECRET: ${{ secrets.INDEXNOW_SECRET }}
        run: |
          if [ -z "$INDEXNOW_SECRET" ]; then
            echo "INDEXNOW_SECRET is not set as a repo secret; skipping." && exit 0
          fi
          echo "Submitting sitemap URLs to IndexNow..."
          curl -sS -X POST https://www.armanarai.ca/api/indexnow \
            -H "Content-Type: application/json" \
            -d "{\"secret\":\"${INDEXNOW_SECRET}\"}" \
            -w "\nHTTP %{http_code}\n"
